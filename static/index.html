<!doctype html>
<!-- Mindly: markup only. Styles -> style.css, behaviour -> app.js (all UI is built from there). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Mindly v5</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🧠%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css?v=15" />
  </head>
  <body>
    <header id="top">
      <div class="logo" data-act="close" title="Home">◉ Mindly</div>
      <nav id="menubar"></nav>
      <button id="pname" class="pname" data-act="rename"></button>
      <span id="savestat" class="stat"></span>
      <span class="sp"></span>
      <button id="btnProjects" data-act="projects"></button>
      <button id="theme" data-act="theme"></button>
    </header>
    <div id="toolbar">
      <div id="tbbtns"></div>
      <div id="props"></div>
    </div>
    <main>
      <aside id="tools"></aside>
      <div id="stage">
        <svg id="svg">
          <defs>
            <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
              <circle cx="1" cy="1" r="1.2" style="fill: var(--grid)" />
            </pattern>
          </defs>
          <rect id="gridrect" width="100%" height="100%" fill="url(#grid)" />
          <g id="world"></g>
        </svg>
        <div id="minimap" hidden>
          <div class="mm-controls">
            <button class="mm-pin" data-mm="pin" title="Pin/Unpin">📌</button>
            <button data-mm="zoomin" title="Zoom in">+</button>
            <button data-mm="zoomout" title="Zoom out">−</button>
            <button class="mm-close" data-mm="close" title="Close minimap">✕</button>
          </div>
          <svg id="mmsvg"></svg>
          <span id="mmzoom" title="Click to reset the minimap to 100%">100%</span>
          <div class="mm-rc" data-c="nw"></div>
          <div class="mm-rc" data-c="ne"></div>
          <div class="mm-rc" data-c="sw"></div>
          <div class="mm-rc" data-c="se"></div>
        </div>
        <div id="fbar" hidden></div>
        <textarea id="editor" hidden spellcheck="false"></textarea>
      </div>
    </main>
    <footer id="status">
      <span id="hint"></span><span class="sp"></span><span id="stats"></span><b id="zf"></b>
    </footer>
    <div id="home"></div>
    <div id="toasts"></div>
    <div id="ctx" hidden></div>
    <div id="cpop" hidden></div>
    <div id="modal" hidden></div>
    <input type="file" id="file" accept=".json,application/json" hidden />
    <script src="app.js?v=15"></script>
  </body>
</html>
